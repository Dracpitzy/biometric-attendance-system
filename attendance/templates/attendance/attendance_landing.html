<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITVlogin — Attendance</title>
<style>
 :root{--navy:#0f172a;--navy-light:#1e293b;--cyan:#06b6d4;--cyan-light:#22d3ee;--muted:#94a3b8;}
 *{box-sizing:border-box;}
 html,body{height:100%;margin:0;}
 body{
   font-family:-apple-system,'Segoe UI',sans-serif;
   background:radial-gradient(ellipse at 50% 30%, #16213e 0%, var(--navy) 60%, #060b16 100%);
   min-height:100vh;
   display:flex;
   flex-direction:column;
   align-items:center;
   justify-content:center;
   overflow:hidden;
   position:relative;
   padding:24px;
 }
 canvas#bgNetwork{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}

 .wordmark{position:absolute;top:26px;left:28px;font-size:18px;font-weight:800;color:#fff;z-index:3;}
 .wordmark span{color:var(--cyan-light);}

 .stage{
   position:relative;
   width:340px;height:340px;
   display:flex;align-items:center;justify-content:center;
   z-index:2;
 }
 .glow{
   position:absolute;
   width:180px;height:180px;
   border-radius:50%;
   background:radial-gradient(circle, rgba(34,211,238,0.35) 0%, rgba(34,211,238,0) 70%);
   animation:pulse 3.2s ease-in-out infinite;
 }
 @keyframes pulse{0%,100%{transform:scale(0.9);opacity:0.7;}50%{transform:scale(1.15);opacity:1;}}

 .ring{
   position:absolute;
   border:1.5px solid rgba(34,211,238,0.25);
   border-radius:50%;
 }
 .ring-1{width:340px;height:340px;animation:spin 22s linear infinite;}
 .ring-2{width:260px;height:260px;border-style:dashed;animation:spin-rev 30s linear infinite;}
 .ring-3{width:180px;height:180px;animation:spin 14s linear infinite;}
 @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
 @keyframes spin-rev{from{transform:rotate(360deg);}to{transform:rotate(0deg);}}

 .orbit-dot{
   position:absolute;
   width:9px;height:9px;
   border-radius:50%;
   background:var(--cyan-light);
   box-shadow:0 0 8px 2px rgba(34,211,238,0.7);
   top:50%;left:50%;
   transform-origin:0 0;
 }

 .center-icon{
   position:relative;
   z-index:2;
   width:64px;height:64px;
   border-radius:50%;
   background:linear-gradient(135deg, var(--cyan) 0%, var(--cyan-light) 100%);
   display:flex;align-items:center;justify-content:center;
   box-shadow:0 0 30px rgba(34,211,238,0.5);
 }

 .content{position:relative;z-index:2;text-align:center;margin-top:26px;max-width:420px;}
 .content h1{color:#fff;font-size:26px;font-weight:800;margin:0 0 8px;}
 .content p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 26px;}

 .cta{
   display:inline-flex;align-items:center;gap:8px;
   background:var(--cyan);color:#fff;border:none;
   padding:14px 28px;border-radius:8px;
   font-size:15px;font-weight:700;
   text-decoration:none;cursor:pointer;
   transition:background 0.15s, transform 0.15s;
   box-shadow:0 10px 30px rgba(6,182,212,0.3);
 }
 .cta:hover{background:var(--cyan-light);transform:translateY(-2px);}
</style>
</head>
<body>

<canvas id="bgNetwork"></canvas>
<div class="wordmark">ITV<span>login</span></div>

<div class="stage">
  <div class="glow"></div>
  <div class="ring ring-1" id="ring1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="center-icon">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.6">
      <path d="M12 2a5 5 0 0 0-5 5v2a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"/>
      <path d="M8 12v2a4 4 0 0 0 8 0v-2M5 12v2a7 7 0 0 0 14 0v-2"/>
    </svg>
  </div>
</div>

<div class="content">
  <h1>Your attendance, at a glance</h1>
  <p>See every day you checked in — month by month — straight from your fingerprint scans at the gate.</p>
  <a href="{% url 'attendance-check' %}" class="cta">Check your attendance record →</a>
</div>

<script>
 // Orbiting dots placed around ring-1's radius, rotating with it via JS (independent of CSS ring spin for varied speed)
 const stage = document.querySelector('.stage');
 const dotCount = 6;
 const radius = 170;
 for (let i = 0; i < dotCount; i++) {
   const dot = document.createElement('div');
   dot.className = 'orbit-dot';
   dot.style.animation = `orbit ${16 + i * 2}s linear infinite`;
   dot.style.animationDelay = `-${i * 2.5}s`;
   dot.dataset.radius = radius;
   stage.appendChild(dot);
 }
 const styleTag = document.createElement('style');
 styleTag.textContent = `
   @keyframes orbit {
     from { transform: rotate(0deg) translateX(${radius}px) rotate(0deg); }
     to   { transform: rotate(360deg) translateX(${radius}px) rotate(-360deg); }
   }
 `;
 document.head.appendChild(styleTag);

 // Background particle network (same technique as register hero)
 const canvas = document.getElementById('bgNetwork');
 const ctx = canvas.getContext('2d');
 let w, h, particles = [];

 function resize() {
   w = canvas.width = window.innerWidth;
   h = canvas.height = window.innerHeight;
 }
 window.addEventListener('resize', resize);

 function seed() {
   particles = [];
   const count = 46;
   for (let i = 0; i < count; i++) {
     particles.push({
       x: Math.random() * w,
       y: Math.random() * h,
       phase: Math.random() * Math.PI * 2,
       speed: 0.15 + Math.random() * 0.3,
       r: Math.random() < 0.15 ? 2 : 1.1,
     });
   }
 }

 function draw(time) {
   ctx.clearRect(0, 0, w, h);
   const t = time * 0.001;
   particles.forEach(p => {
     p.dx = p.x + Math.sin(t * p.speed + p.phase) * 14;
     p.dy = p.y + Math.cos(t * p.speed + p.phase) * 14;
   });
   for (let i = 0; i < particles.length; i++) {
     for (let j = i + 1; j < particles.length; j++) {
       const a = particles[i], b = particles[j];
       const dist = Math.hypot(a.dx - b.dx, a.dy - b.dy);
       if (dist < 110) {
         ctx.strokeStyle = `rgba(6, 182, 212, ${(1 - dist / 110) * 0.15})`;
         ctx.lineWidth = 1;
         ctx.beginPath();
         ctx.moveTo(a.dx, a.dy);
         ctx.lineTo(b.dx, b.dy);
         ctx.stroke();
       }
     }
   }
   particles.forEach(p => {
     ctx.beginPath();
     ctx.arc(p.dx, p.dy, p.r, 0, Math.PI * 2);
     ctx.fillStyle = 'rgba(34, 211, 238, 0.55)';
     ctx.fill();
   });
   requestAnimationFrame(draw);
 }

 resize();
 seed();
 requestAnimationFrame(draw);
</script>
</body>
</html>
